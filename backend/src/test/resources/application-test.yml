spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  datasource:
    hikari:
      maximum-pool-size: 5

app:
  jwt:
    secret: test-secret-key-that-is-at-least-32-bytes-long
    expiration: PT24H
    issuer: job-tracker-test
  cors:
    allowed-origins: http://localhost:5173
